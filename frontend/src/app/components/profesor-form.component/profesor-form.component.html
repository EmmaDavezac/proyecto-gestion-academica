<p>profesor-form.component works!</p>
<h2 mat-dialog-title>{{ isEditMode ? 'Editar Profesor' : 'Nuevo Profesor' }}</h2>

<mat-dialog-content class="profesor-form" [formGroup]="form">
  <div class="form-grid">
    <mat-form-field appearance="fill" class="full-width grid-item">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
    </mat-form-field>


    <mat-form-field appearance="fill" class="full-width grid-item">
      <mat-label>Apellido</mat-label>
      <input matInput formControlName="apellido">
    </mat-form-field>


    <mat-form-field appearance="fill" class="full-width grid-item">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>

       <mat-form-field appearance="fill" class="full-width grid-item">
      <mat-label>Titulo</mat-label>
      <input matInput formControlName="titulo">
    </mat-form-field>

   <mat-form-field appearance="fill" class="full-width grid-item">
      <mat-label>Sueldo</mat-label>
      <input matInput formControlName="sueldo">
    </mat-form-field>


    <div class="grid-spacer"></div>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions" align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()">Guardar</button>
</mat-dialog-actions>
